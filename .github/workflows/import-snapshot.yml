name: Import validated SENARA snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: senara-clean-import
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Extract active game only
        env:
          SOURCE_SHA: b14abe30c0c71ff9cdee41721429f465750c7524
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/senara"
          mkdir -p "$target"
          legacy="$RUNNER_TEMP/legacy-source"
          git init -q "$legacy"
          git -C "$legacy" remote add origin https://github.com/eneft/Lembah-Asri.git
          git -C "$legacy" fetch --no-tags --depth=1 origin "$SOURCE_SHA" f76ff43101abdb2dea3fcde9897c2711228a1eff
          git -C "$legacy" archive "$SOURCE_SHA" web tools/audit_repo_size.py .github/workflows/repository-size-audit.yml .github/workflows/threejs-foundation.yml .github/workflows/deploy-web.yml | tar -xf - -C "$target"
          git -C "$legacy" show f76ff43101abdb2dea3fcde9897c2711228a1eff:tools/prepare_senara_snapshot.py > "$RUNNER_TEMP/prepare_senara_snapshot.py"
          python3 "$RUNNER_TEMP/prepare_senara_snapshot.py" "$target" --source-commit "$SOURCE_SHA"
          printf '%s\n' '# SENARA' '' 'Three.js cozy farming adventure. Active game repository; original development history is preserved at eneft/Lembah-Asri.' '' 'Development: cd web && npm install && npm run dev.' '' 'Asset filenames use lowercase kebab-case; original SHA256 hashes and paths are documented in docs/asset-migration-manifest.json. Standard TypeScript module, entrypoint and configuration names remain intact.' '' 'GitHub Pages requires setup in Settings > Pages > GitHub Actions before enabling deployment.' > "$target/README.md"
          printf '%s\n' 'node_modules/' 'dist/' 'release/' '/web/artifacts/' '/web/coverage/' '*.log' '.env' '.env.*' '!.env.example' '.DS_Store' 'Thumbs.db' '__pycache__/' > "$target/.gitignore"
          # Do not deploy automatically in a new repository before Pages configuration.
          python3 - "$target" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          path = root / ".github/workflows/deploy-web.yml"
          content = path.read_text()
          start = content.index("on:\n")
          end = content.index("\npermissions:", start)
          content = content[:start] + "on:\n  workflow_dispatch:\n" + content[end:]
          path.write_text(content.replace("Lembah Asri (Three.js)", "SENARA (Three.js)").replace("pages-lembah-asri", "pages-senara"))
          PY
          du -sh "$target"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate renamed sources and all tests
        working-directory: ${{ runner.temp }}/senara/web
        run: |
          set -euo pipefail
          npm install
          npm run build
          test -s dist/index.html
          node --experimental-strip-types --test tests/*.test.mjs
          npm run test:farm-browser
          node scripts/check-creek-visual.mjs
      - name: Package clean source (exclude generated assets and dependencies)
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/senara"
          out="$RUNNER_TEMP/senara-import"
          mkdir -p "$out"
          python3 - "$target" "$out" <<'PY'
          import sys, json, hashlib, zipfile
          from pathlib import Path
          root, out = map(Path, sys.argv[1:])
          manifest = json.loads((root / "docs/asset-migration-manifest.json").read_text())
          for asset in manifest["assets"]:
              p = root / asset["new"]
              if hashlib.sha256(p.read_bytes()).hexdigest() != asset["sha256"]:
                  raise RuntimeError("Authored asset changed during build: " + str(p))
          generated = set(manifest["generatedNames"].values())
          excluded_dirs = {"node_modules", "dist", "release", "artifacts", "coverage", "__pycache__", ".git"}
          archive = out / "SENARA-clean-source.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=5) as z:
              for p in sorted(root.rglob("*")):
                  rel = p.relative_to(root)
                  if not p.is_file() or excluded_dirs.intersection(rel.parts):
                      continue
                  if rel.as_posix().startswith("web/public/models/character/clips/"):
                      continue
                  if p.name in generated and not any(asset["new"] == rel.as_posix() for asset in manifest["assets"]):
                      continue
                  if p.name == "package-lock.json":
                      continue
                  z.write(p, rel.as_posix())
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              names = set(z.namelist())
              assert "web/package.json" in names and ".github/workflows/threejs-foundation.yml" in names
              assert all(asset["new"] in names for asset in manifest["assets"])
              assert all(not name.startswith(("assets/", "blockout3d/")) for name in names)
          (out / "SHA256SUMS").write_text(hashlib.sha256(archive.read_bytes()).hexdigest() + "  " + archive.name + "\n")
          print(f"Clean import verified: {archive.stat().st_size:,} bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SENARA-clean-source
          path: ${{ runner.temp }}/senara-import/
          compression-level: 0
          retention-days: 30
      - name: Push validated clean snapshot to staging branch
        run: |
          set -euo pipefail
          branch=migration/clean-import
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Staging branch already exists; refusing to overwrite."
            exit 1
          fi
          git switch -c "$branch"
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          root = Path.cwd()
          archive = Path(os.environ["RUNNER_TEMP"]) / "senara-import/SENARA-clean-source.zip"
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  if not name.startswith(".github/"):
                      z.extract(name, root)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .gitignore docs tools web
          git commit -m "Import verified SENARA game snapshot with normalized asset paths"
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
